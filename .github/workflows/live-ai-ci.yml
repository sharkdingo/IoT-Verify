name: Live AI CI

# The live-AI suite calls a real external model endpoint, so it belongs on its own explicit gate
# rather than inside a required check. Three reasons, all of them practical:
#
#  1. It cannot be a merge blocker. A transport failure at the provider fails the run for reasons
#     unrelated to the commit — this repo has already seen it, where a different one of the two tests
#     failed on consecutive runs with the same code. A required check that goes red on someone else's
#     outage teaches people to ignore red checks.
#  2. It costs real money and real quota per run.
#  3. It needs a secret, which is unavailable to fork pull requests, so on a fork it could only ever
#     fail or be silently skipped.
#
# It still runs automatically every night, so a genuine break in the AI path is caught within a day,
# and on demand for anyone touching that path.
#
# When the secret is absent the run is SKIPPED, not failed. The two states mean different things and
# must look different: "nobody configured a key" is a repository setup fact, while red is reserved for
# "the AI path is broken". Conflating them cost eleven consecutive nightly failures, every one of them
# exiting at the credential check before building anything — a daily red that carried no information
# and that no reader could act on without knowing the history. A skipped job still makes the run report
# `success`, though, so the skip is carried by the `status` job's *name* -- visible in the check list and
# on the run page -- rather than only by an annotation buried inside a job nobody opens.

on:
  schedule:
    # Daily at 04:23 UTC. Provider availability can change independently of repository changes.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only one live-AI run at a time regardless of ref: they share an external quota, so overlapping
  # runs would make each other flaky.
  group: live-ai-ci
  cancel-in-progress: false

jobs:
  # The `secrets` context is not available in a job-level `if:` (only github, needs, vars, inputs), so
  # a secret cannot gate a job directly. This job reads it in a `run` step — where it *is* available —
  # and publishes a boolean the real job gates on. The value is passed through `env` rather than
  # interpolated into the script body, so it never reaches a command line.
  preflight:
    name: Check credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'sharkdingo/IoT-Verify'
    outputs:
      configured: ${{ steps.probe.outputs.configured }}
    steps:
      - name: Probe for an API key
        id: probe
        shell: bash
        env:
          KEY: ${{ secrets.IOT_VERIFY_OPENAI_API_KEY }}
          BASE_URL: ${{ secrets.IOT_VERIFY_OPENAI_BASE_URL }}
        run: |
          # `set -e` matters here specifically: without it a failed $GITHUB_OUTPUT write still exits 0,
          # the output resolves to the empty string, and the gate skips exactly as it would with no key
          # at all -- an unwritable output file must not be indistinguishable from an unconfigured repo.
          set -euo pipefail

          # Whitespace is stripped before the emptiness test: a secret holding only whitespace would
          # otherwise read as configured and fail 10 minutes later at the model call, which is the
          # confusing failure this job exists to prevent. Embedded whitespace is rejected for the same
          # reason -- a key pasted with a stray newline passes a non-empty test but is unusable in an
          # HTTP header, so it must fail here rather than after the build.
          key_stripped="$(printf '%s' "${KEY:-}" | tr -d '[:space:]')"
          if [ -n "$key_stripped" ] && [ "$key_stripped" != "${KEY:-}" ]; then
            echo '::error::IOT_VERIFY_OPENAI_API_KEY contains whitespace. It cannot be sent as an HTTP header, so the gate would fail after a ~10 minute build. Re-set the secret without leading, trailing, or embedded whitespace.'
            exit 1
          fi

          if [ -n "$key_stripped" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            {
              echo '### Live-AI gate running'
              echo
              echo '`IOT_VERIFY_OPENAI_API_KEY` is configured.'
              # The base URL is reported, never required: the probe cannot know whether this key belongs
              # to api.openai.com or to a compatible endpoint. Stating which of the two the run assumed
              # is what makes an auth or 404 failure at the model call diagnosable from the summary.
              if [ -n "$(printf '%s' "${BASE_URL:-}" | tr -d '[:space:]')" ]; then
                echo '`IOT_VERIFY_OPENAI_BASE_URL` is set, so a non-default endpoint will be used.'
              else
                echo '`IOT_VERIFY_OPENAI_BASE_URL` is not set, so the run assumes `api.openai.com`.'
                echo 'If this key belongs to a compatible endpoint instead, the model call will fail on auth or 404.'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            # A warning, not an error: the run is skipped rather than failed, but it must not read as a
            # gate that passed. Anyone wanting the gate live needs the two repository secrets below.
            echo '::warning::IOT_VERIFY_OPENAI_API_KEY is not configured, so the live-AI gate was skipped. The AI path was NOT verified by this run. Set the repository secrets IOT_VERIFY_OPENAI_API_KEY and (if not using api.openai.com) IOT_VERIFY_OPENAI_BASE_URL to enable it.'
            {
              echo '### Live-AI gate skipped'
              echo
              echo '`IOT_VERIFY_OPENAI_API_KEY` is not configured, so **the AI path was not verified**.'
              echo 'This is a repository setup state, not a test failure — nothing was run against the model endpoint.'
              echo
              echo 'To enable the gate, set these repository secrets:'
              echo
              echo '- `IOT_VERIFY_OPENAI_API_KEY` — required.'
              echo '- `IOT_VERIFY_OPENAI_BASE_URL` — only if the endpoint is not `api.openai.com`.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  live-ai:
    name: Live AI end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: preflight
    # A missing secret skips this job instead of failing it. The repository check is repeated rather than
    # inherited from `preflight`: this is the job that spends real quota and real money, so the condition
    # that keeps it off forks belongs where the cost is, not one `needs:` edge away from it.
    if: github.repository == 'sharkdingo/IoT-Verify' && needs.preflight.outputs.configured == 'true'
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_DATABASE: iot_verify
          MYSQL_USER: iot_verify
          MYSQL_PASSWORD: iot_verify_ci
          MYSQL_ROOT_PASSWORD: root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/iot_verify?useSSL=false&serverTimezone=UTC&characterEncoding=utf-8&allowPublicKeyRetrieval=true
      DB_USERNAME: iot_verify
      DB_PASSWORD: iot_verify_ci
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-only-jwt-secret-must-be-at-least-256-bits-long
      IOT_VERIFY_TIME_ZONE: UTC
      SERVER_PORT: 8080
      NUSMV_MAX_CONCURRENT: 1
      AUTH_SOURCE_REGISTER_RATE_LIMIT_PER_HOUR: 2000
      AUTH_SOURCE_LOGIN_RATE_LIMIT_PER_MINUTE: 4000
      AUTH_LOGIN_RATE_LIMIT_PER_MINUTE: 500
      E2E_API_BASE_URL: http://127.0.0.1:8080
      PLAYWRIGHT_HTML_OPEN: never
      RUN_LIVE_AI_E2E: '1'
      IOT_VERIFY_OPENAI_API_KEY: ${{ secrets.IOT_VERIFY_OPENAI_API_KEY }}
      IOT_VERIFY_OPENAI_BASE_URL: ${{ secrets.IOT_VERIFY_OPENAI_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No "require credentials" step: `needs.preflight` already proved the key exists, and a second
      # check would be a second place to keep in sync.

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup NuSMV
        uses: ./.github/actions/setup-nusmv

      - name: Build backend
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Restore Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run live-AI suite
        shell: bash
        run: .github/scripts/run-e2e.sh live-ai

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-ai-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/backend-e2e.log
            frontend/playwright-report/
            frontend/test-results/

  # A skipped job makes the whole run report `success`, so without this job the Actions list, the badge
  # and the nightly notification all show a passing Live AI gate for a run that never called the model.
  # The warning annotation inside `preflight` is not enough: it is invisible from everywhere the outcome
  # is actually read. This job carries the state in its *name*, which the run page and the check list
  # both show, so an unverified run cannot be mistaken for a verified one without inventing a red that
  # nobody can act on. It still fails for a genuine break in the AI path, or if `preflight` itself
  # broke -- an unknown credential state is not a skip.
  status:
    name: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.configured != 'true' && 'Live AI NOT verified (no API key)' || 'Live AI status' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [preflight, live-ai]
    if: always() && github.repository == 'sharkdingo/IoT-Verify'
    steps:
      - name: Report the gate outcome
        shell: bash
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          CONFIGURED: ${{ needs.preflight.outputs.configured }}
          # Index syntax, not `needs.live-ai.result`: a hyphen in a job id parses as subtraction in a
          # GitHub expression, which evaluates to an empty string instead of erroring.
          SUITE: ${{ needs['live-ai'].result }}
        run: |
          set -euo pipefail
          if [ "$PREFLIGHT" != 'success' ]; then
            echo "::error::The credential preflight did not succeed (result: $PREFLIGHT), so whether the AI path works is unknown."
            exit 1
          fi
          if [ "$CONFIGURED" != 'true' ]; then
            echo '::warning::The live-AI gate was skipped: no API key is configured. The AI path was NOT verified by this run.'
            echo 'AI path NOT verified: no API key configured. See the Check credentials job.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$SUITE" != 'success' ]; then
            echo "::error::The live-AI suite did not pass (result: $SUITE)."
            exit 1
          fi
          echo 'AI path verified against the real model endpoint.' >> "$GITHUB_STEP_SUMMARY"
