name: Fast CI

# One push/PR entry point. Ordinary changes run scoped unit tests, builds and smoke; main and
# high-risk changes call Full CI instead. Full includes smoke, so the two tiers never run together.

on:
  push:
  pull_request:

permissions:
  contents: read

# A superseded push is wasted capacity and a misleading red X on an old commit. main is exempt:
# every commit that lands there deserves its own recorded result.
concurrency:
  # On main the group includes the commit, so a later push cannot supersede an earlier
  # commit's run: each landed commit keeps its own recorded verdict. Relying on
  # cancel-in-progress being false was not enough -- a main run was cancelled in practice
  # the moment the next commit landed, which is exactly the history this is meant to keep.
  # On other refs the group omits the sha, so a superseded push is cancelled as intended.
  group: fast-ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  route:
    name: Route by risk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      smoke: ${{ steps.decide.outputs.fast }}
      full: ${{ steps.decide.outputs.full }}
      inert: ${{ steps.decide.outputs.inertOnly }}
      reasons: ${{ steps.decide.outputs.reasons }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Need enough history to diff against the base commit.
          fetch-depth: 0

      - name: Verify CI routing and gates
        run: node --test .github/*.test.mjs

      # Runs here, in the one job that executes for every push, because a docs-only branch change
      # routes as inert and skips every test tier below -- so this is the only place that reads those
      # files at all. Needs no dependency install and takes about a second.
      - name: Verify documentation cross-references
        run: |
          node .github/docs-link-check-cli.mjs .

      - name: Collect changed paths
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # A brand-new branch has no `before` commit, and a force-push leaves one that is gone. In
          # both cases the meaningful comparison is the default branch: that is what the work merges
          # into and what a reviewer diffs. Falling straight through to "no path list" made a
          # docs-only branch run the whole fast tier -- safe, but exactly the waste this exists to fix.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            default="origin/${{ github.event.repository.default_branch }}"
            if git cat-file -e "$default^{commit}" 2>/dev/null; then
              base="$(git merge-base "$default" "$head" || true)"
              echo "no usable push base; comparing against $default ($base)"
            else
              base=""
            fi
          fi
          # Still nothing usable (first commit, unrelated history): emit no paths, which routes to the
          # fast tier rather than guessing a diff.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "changed<<EOF" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
            echo "no usable base commit; routing without a path list"
            exit 0
          fi
          {
            echo "changed<<EOF"
            git diff --name-only "$base" "$head"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          git diff --name-only "$base" "$head" | sed 's/^/  changed: /'

      - name: Decide tiers
        id: decide
        env:
          CHANGED_PATHS: ${{ steps.changes.outputs.changed }}
          GITHUB_REF_INPUT: ${{ github.ref }}
          GITHUB_EVENT_INPUT: ${{ github.event_name }}
        run: node .github/ci-risk-router.mjs >> "$GITHUB_OUTPUT"

      - name: Summarize
        shell: bash
        run: |
          {
            echo "### CI routing"
            echo
            echo "| tier | run |"
            echo "| --- | --- |"
            echo "| backend unit/integration | ${{ steps.decide.outputs.backend }} |"
            echo "| frontend unit/build | ${{ steps.decide.outputs.frontend }} |"
            echo "| E2E smoke | ${{ steps.decide.outputs.fast }} |"
            echo "| reusable Full CI | ${{ steps.decide.outputs.full }} |"
            echo
            echo "Reasons: ${{ steps.decide.outputs.reasons }}"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend checks & build
    needs: route
    if: needs.route.outputs.frontend == 'true' || needs.route.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Typecheck first: it is the cheapest check that catches the largest class of mistake, and a
      # type error makes every downstream failure noise.
      - name: Typecheck
        run: npx vue-tsc -b --clean && npx vue-tsc -b

      - name: Unit tests
        if: needs.route.outputs.frontend == 'true'
        run: npm run test:unit -- --run

      - name: Build
        run: npx vite build

      # The smoke job needs this bundle; building it twice is pure duplication.
      - name: Upload frontend bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 1
          if-no-files-found: error

  backend:
    name: Backend checks & package
    needs: route
    if: needs.route.outputs.backend == 'true' || needs.route.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_DATABASE: iot_verify_undo_it
          MYSQL_USER: iot_verify
          MYSQL_PASSWORD: iot_verify_ci
          MYSQL_ROOT_PASSWORD: root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup NuSMV
        uses: ./.github/actions/setup-nusmv

      # `package` rather than `test`: same test run, and it also produces the jar the smoke job needs,
      # so the E2E tier no longer recompiles the whole tree from scratch.
      - name: Test and package
        if: needs.route.outputs.backend == 'true'
        env:
          DB_USERNAME: iot_verify
          DB_PASSWORD: iot_verify_ci
        run: mvn -B package -Diot.verify.mysql.required=true

      # Smoke still needs a fresh jar when only frontend source changed.
      - name: Package unchanged backend
        if: needs.route.outputs.backend != 'true'
        run: mvn -B package -DskipTests

      - name: Upload backend jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/target/*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-surefire-${{ github.sha }}
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  smoke:
    name: E2E smoke
    needs: [route, frontend, backend]
    # Both artifact producers must succeed, even when one language's unit suite was routed out.
    if: |
      always() && needs.route.outputs.smoke == 'true'
      && needs.frontend.result == 'success' && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_DATABASE: iot_verify
          MYSQL_USER: iot_verify
          MYSQL_PASSWORD: iot_verify_ci
          MYSQL_ROOT_PASSWORD: root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/iot_verify?useSSL=false&serverTimezone=UTC&characterEncoding=utf-8&allowPublicKeyRetrieval=true
      DB_USERNAME: iot_verify
      DB_PASSWORD: iot_verify_ci
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-only-jwt-secret-must-be-at-least-256-bits-long
      IOT_VERIFY_OPENAI_API_KEY: sk-ci-unused
      IOT_VERIFY_TIME_ZONE: UTC
      SERVER_PORT: 8080
      NUSMV_MAX_CONCURRENT: 1
      AUTH_SOURCE_REGISTER_RATE_LIMIT_PER_HOUR: 2000
      AUTH_SOURCE_LOGIN_RATE_LIMIT_PER_MINUTE: 4000
      AUTH_LOGIN_RATE_LIMIT_PER_MINUTE: 500
      E2E_API_BASE_URL: http://127.0.0.1:8080
      E2E_PREBUILT_DIST: '1'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup NuSMV
        uses: ./.github/actions/setup-nusmv

      - name: Download backend jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/target/

      - name: Download frontend bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the resolved Playwright version, so a dependency bump misses and reinstalls
          # rather than running new test code against an old browser.
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend and run smoke barrier
        shell: bash
        run: .github/scripts/run-e2e.sh smoke

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-smoke-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/backend-e2e.log
            frontend/playwright-report/
            frontend/test-results/

  escalate:
    name: Escalate to Full CI
    needs: route
    if: needs.route.outputs.full == 'true'
    # The reusable workflow uploads and downloads the build artifacts it shares between its own jobs,
    # which needs actions: write. A called workflow does not inherit the caller's block, so it is
    # granted explicitly here rather than failing at the upload step with a permissions error that
    # points at artifacts instead of at this line.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/full-ci.yml
    with:
      reason: ${{ needs.route.outputs.reasons }}

  fast-ci:
    name: Fast CI
    # A selected tier must pass; a missing, cancelled or skipped required result is a failure.
    needs: [route, frontend, backend, smoke, escalate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tier results
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/check-ci-results.mjs
